name: Update GitHub Repo Table

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:    # Manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Update README with dynamic repo table
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python update_repo_table.py

      - name: Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update repository table" || echo "No changes to commit"
          git push https://$GH_TOKEN@github.com/abhishek-2247/abhishek-2247.git HEAD:main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
